<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info om gul finnet kirurg fisken</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <main id="scene">
      <h4>Gulfinnet kirurg fisk</h4>
      <button onclick="lukkeKnap()">
        <img src="images/kryds.png" alt="kryds knap" />
      </button>
      <div id="ibGulFinnetFiskBillede">
        <img src="images/fisk-gif.gif" alt="Gul finnet fisk" />
      </div>

      <div id="infoboks">
        <div>
          <h3>Navn</h3>
          <p>Gulfinnet kirurg fisk</p>
        </div>

        <br />

        <div>
          <h3>Hvor bor den?:</h3>
          <p>I Det Indiske Ocean og Stillehavet, ofte i koralrev.</p>
        </div>

        <br />

        <div>
          <h3>Kendetegn/Udseende:</h3>
          <p>Klar blå krop med gule finner - meget iøjnefaldende og smuk.</p>
        </div>

        <br />
        <div>
          <h3>Fun fact:</h3>
          <p>
            Det er den fisk, som figuren “Dory” i Find Nemo og Find Dory er
            inspireret af!
          </p>
        </div>
      </div>
    </main>
    <script src="js/js.js"></script>
