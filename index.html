<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akvarie projekt gruppe 7</title>

    <main id="scene">
      <div id="baggrundBillede">

          src="images/Fisk-Ida-done-kopi.gif"

      <div id="fiskBenjamin">

          src="images/Klovnfisksvøm.gif"
          alt="fisk der svømmer af Josephine"

      <div id="fiskJosephine2">
        <img
          src="images/Rævefjæs.gif"
          alt="fisk der svømmer også af Josephine"
        />
      </div>

      
      <div id="fiskMathilde">

          <div class="boble">

          <div class="boble">

          </div>
          <div class="boble">
            <img src="images/farvelæg boble.png" alt="farvelæg spil" />
          </div>
          <div class="boble">
            <img src="images/find5fejlboble.png" alt="find fem fejl spil" />
          </div>
          <div class="boble">
            <img src="images/havinfoboble.png" alt="hav info" />
          </div>
          <div class="boble">
            <img src="images/infoboble.png" alt="info om fisk" />
          </div>
          <div class="boble">
            <img
              src="images/forkert dyr boble.png"
              alt="find forkert dyr spil"
            />
          </div>
        </div>

    <script></script>
