<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akvarie projekt gruppe 7</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <main id="scene">
      <!--Vi har alle lavet vores egne animation-->
      <div id="fiskIda">
        <img
          src="images/Fisk-Ida-done-kopi.gif"
          alt="fisk der svømmer af Ida"
        />
      </div>

      <div id="fiskBenjamin">
        <img src="images/fisk-gif.gif" alt="fisk der svømmer af Benjamin" />
      </div>

      <div id="fiskJosephine">
        <img
          src="images/Klovnfisksvøm.gif"
          alt="fisk der svømmer af Josephine"
        />
      </div>

      <div id="fiskJosephine2">
        <img
          src="images/Rævefjæs.gif"
          alt="fisk der svømmer også af Josephine"
        />
      </div>

      <div id="fiskMathilde">
        <img src="images/Dory.gif" alt="fisk der svømmer af Mathilde" />
      </div>

      <!-- Karusel med knapper, lavet af Benjamin, Ida og Josephine -->
      <div class="carousel">
        <div class="knapper">
          <div class="boble">
            <img src="images/racerbilboble.png" alt="racerbil spil" />
          </div>
          <div class="boble">
            <img
              src="images/vendespilboble.png"
              alt="vende spil"
              id="vendespilKnap"
            />
          </div>
          <div class="boble">
            <img
              src="images/puslespilboble.png"
              alt="pusle spil"
              id="puslespilKnap"
            />
          </div>
          <div class="boble">
            <img
              src="images/farvelæg boble.png"
              alt="farvelæg spil"
              id="farvelægspilKnap"
            />
          </div>
          <div class="boble">
            <img
              src="images/find5fejlboble.png"
              alt="find fem fejl spil"
              id="findfemfejlKnap"
            />
          </div>
          <div class="boble">
            <img src="images/havinfoboble.png" alt="hav info" />
          </div>
          <div class="boble">
            <img src="images/infoboble.png" alt="info om fisk" />
          </div>
          <div class="boble">
            <img
              src="images/forkert dyr boble.png"
              alt="find forkert dyr spil"
            />
          </div>
        </div>
      </div>
    </main>

    <script src="js/js.js"></script>
  </body>
</html>
